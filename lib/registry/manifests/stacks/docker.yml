apiVersion: brik.dev/v1
kind: Stack
metadata:
  id: docker
  displayName: Docker
  owner: getbrik
spec:
  detect:
    # Docker is a builder helper, not a project.stack (the brik.yml
    # project.stack enum excludes it). It must never be the result of bare
    # workspace auto-detection, or a Dockerfile would shadow the real language
    # stack (e.g. a node project with a Dockerfile). Markers are kept for
    # documentation/impact; autodetect:false keeps it out of stacks.detect.
    autodetect: false
    markers:
      any:
        - Dockerfile
        - Containerfile
        - docker-compose.yml
  runner:
    image: ghcr.io/getbrik/brik-runner-base
    defaultVersion: "latest"
    versions: ["latest"]
  cache:
    paths:
      - .docker/buildx-cache
  impact:
    source:
      - Dockerfile
      - Containerfile
      - "**/Dockerfile"
      - "**/Containerfile"
      - ".dockerignore"
    build:
      - Dockerfile
      - Containerfile
      - "**/*.Dockerfile"
  api:
    module: stacks.docker
    required:
      - stacks.docker.build
    optional:
      - stacks.docker.test

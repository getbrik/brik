version: 1
project:
  name: polyglot-libs
  stack: node
release:
  strategy: semver
test:
  framework: npm
package:
  docker:
    image: ghcr.io/example/app
    dockerfile: Dockerfile
publish:
  npm:
    registry: https://registry.npmjs.org
    tag: latest
    access: public
  docker:
    registry: ghcr.io
    tags:
      - latest
  maven:
    repository: https://nexus.example.com/repository/maven-releases/
  pypi:
    repository: https://upload.pypi.org/legacy/
  cargo:
    registry: crates-io
    index: sparse+https://nexus.example.com/repository/brik-cargo/
  nuget:
    source: https://api.nuget.org/v3/index.json

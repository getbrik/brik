# Brik Notify Stage
# Prints pipeline summary. Always runs regardless of previous stage results.

brik-notify:
  stage: notify
  needs:
    - job: brik-init
      artifacts: true
    - job: brik-release
      artifacts: true
      optional: true
    - job: brik-build
      artifacts: true
      optional: true
    - job: brik-lint
      artifacts: true
      optional: true
    - job: brik-sast
      artifacts: true
      optional: true
    - job: brik-scan
      artifacts: true
      optional: true
    - job: brik-test
      artifacts: true
      optional: true
    - job: brik-package
      artifacts: true
      optional: true
    - job: brik-container-scan
      artifacts: true
      optional: true
    - job: brik-deploy
      artifacts: true
      optional: true
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage notify'
  when: always
  # Expose the pipeline report written by stages.notify so it is reachable
  # via the GitLab job artifact URL (suitable for Slack/email links later).
  artifacts:
    when: always
    expire_in: 1 month
    name: "pipeline-report-${CI_PIPELINE_ID}"
    paths:
      - brik-artifacts/

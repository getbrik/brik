# Brik Notify Stage
# Prints pipeline summary and aggregates the per-stage report fragments
# (including the not-applicable fragments written by the plan gate of
# skipped stages). Always runs regardless of previous stage results.
#
# Artifacts override (extends doesn't merge): notify adds a custom name
# (downloadable as aggregate-report-<pipeline-id>), expire_in: 1 month
# (longer retention than the per-stage 1 week), and the GitLab SAST
# report (gl-sast-report.json) which surfaces findings in the MR widget
# on non-Ultimate instances. The Ultimate per-stage SARIF overlay
# (sast-reports.yml) is additive on top of this.

brik-notify:
  extends: .brik-stage
  stage: notify
  image: ${BRIK_IMG_BASE}
  variables:
    BRIK_STAGE_ID: notify
  when: always
  needs:
    - { job: brik-plan,           artifacts: true }
    - { job: brik-init,           artifacts: true }
    - { job: brik-release,        artifacts: true,  optional: true }
    - { job: brik-build,          artifacts: true,  optional: true }
    - { job: brik-lint,           artifacts: true,  optional: true }
    - { job: brik-sast,           artifacts: true,  optional: true }
    - { job: brik-scan,           artifacts: true,  optional: true }
    - { job: brik-test,           artifacts: true,  optional: true }
    - { job: brik-package,        artifacts: true,  optional: true }
    - { job: brik-container-scan, artifacts: true,  optional: true }
    - { job: brik-promote,        artifacts: true,  optional: true }
    - { job: brik-deploy,         artifacts: true,  optional: true }
  artifacts:
    when: always
    expire_in: 1 month
    name: "aggregate-report-${CI_PIPELINE_ID}"
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
    reports:
      dotenv: .brik-logs/pipeline.env
      sast: brik-artifacts/gl-sast-report.json

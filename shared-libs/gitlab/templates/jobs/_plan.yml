# Brik Plan Stage (D.5c)
#
# Runs the planner against the working tree, writes plan.json plus the
# child pipeline YAML, and records "not-applicable" fragments for every
# stage the plan marks skip. Those fragments are uploaded as artifacts
# so the downstream child pipeline (and its final notify job) sees the
# complete set of stage records, with reason, even for stages that the
# child never runs.

brik-plan:
  stage: plan
  needs: []
  script:
    - |
      set -euo pipefail
      bash -c '. /tmp/brik-bootstrap.sh && command -v brik >/dev/null 2>&1 || ln -sf "${BRIK_HOME}/bin/brik" /usr/local/bin/brik'
      # Auto-resolve the opt-in flags from CI context so the planner
      # default mirrors the legacy fixed-flow semantics:
      #   - tag push (CI_COMMIT_TAG set) -> --with-release --with-package
      #     (a release pipeline always cuts a release and a package; that
      #     is the entire reason for a tag push in the brik flow).
      #   - BRIK_WITH_DEPLOY=true CI variable -> --with-deploy.
      # Projects that need finer control set the CI vars BRIK_WITH_RELEASE,
      # BRIK_WITH_PACKAGE, BRIK_WITH_DEPLOY directly.
      _opts=()
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${BRIK_WITH_RELEASE:-false}" = "true" ]; then
        _opts+=(--with-release)
      fi
      if [ -n "${CI_COMMIT_TAG:-}" ] || [ "${BRIK_WITH_PACKAGE:-false}" = "true" ]; then
        _opts+=(--with-package)
      fi
      if [ "${BRIK_WITH_DEPLOY:-false}" = "true" ]; then
        _opts+=(--with-deploy)
      fi
      brik plan --workspace "${CI_PROJECT_DIR}" \
                --out "${CI_PROJECT_DIR}/.brik-logs/plan.json" \
                --format gitlab-child \
                "${_opts[@]}"
      export BRIK_PLAN_FILE="${CI_PROJECT_DIR}/.brik-logs/plan.json"
      export BRIK_WORKSPACE="${CI_PROJECT_DIR}"
      jq -r '.stages[] | select(.decision == "skip") | .id' "$BRIK_PLAN_FILE" \
        | while IFS= read -r _stage; do
            [ -z "${_stage}" ] && continue
            brik plan gate "${_stage}" || true
          done
  artifacts:
    when: always
    paths:
      - .brik-logs/plan.json
      - .brik-logs/plan.yml
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
    expire_in: 1 day

# brik-downstream triggers the child pipeline from the YAML produced
# above. The downstream stage runs after plan so any plan-time failure
# stops the parent before spinning up child resources.
#
# trigger:forward:yaml_variables: false stops the parent's `variables:`
# block from being forwarded to the child. Without it, the parent's
# BRIK_CI_IMAGE (deliberately set to the base runner for brik-plan)
# would shadow the brik-runner-<stack>:<version> value that the child's
# brik-init writes into pipeline.env, so the child's brik-build, lint,
# test, ... would all run on the base runner and fail (e.g. "required
# tool not found: node"). The child still inherits CI variables defined
# at the GitLab project level via pipeline_variables forwarding.
brik-downstream:
  stage: downstream
  needs:
    - job: brik-plan
      artifacts: true
  trigger:
    include:
      - artifact: .brik-logs/plan.yml
        job: brik-plan
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: true

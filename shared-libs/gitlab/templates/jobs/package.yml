# Brik Package Stage
# Container build + publish (conditional - only if package section configured).
# Waits for all verify jobs to complete.

brik-package:
  stage: package
  needs:
    - job: brik-init
      artifacts: true
    - job: brik-release
      artifacts: true
      optional: true
    - job: brik-build
      artifacts: true
    - job: brik-test
      artifacts: true
    - job: brik-lint
      artifacts: false
      optional: true
    - job: brik-sast
      artifacts: false
      optional: true
    - job: brik-scan
      artifacts: false
      optional: true
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    # Synced from lib/stacks/_deps.sh::stacks.cache_paths.
    # Drift caught by spec/integration/cache_paths_parity_spec.sh.
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  script:
    # Install Docker CLI if socket is available (needed for docker build/push)
    - |
      if [ -S /var/run/docker.sock ] && ! command -v docker >/dev/null 2>&1; then
        echo "[brik] Installing Docker CLI..."
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache docker-cli
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq && apt-get install -y -qq docker.io
        fi
      fi
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage package'
  artifacts:
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
    when: always
    expire_in: 1 week
  # No tag-only gate: producing a package on every commit is the
  # essence of CI. The bash short-circuits silently when no
  # package.docker.image is configured (image_built=false).

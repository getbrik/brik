# Brik Scan Reports Overlay (Ultimate)
# Adds artifacts.reports.sarif to brik-scan so osv-scanner and gitleaks
# findings surface in the GitLab Security tab. The reports.sarif key is
# rejected at YAML parse time on Free / Premium tiers; pipeline.yml includes
# this overlay only when CI_GITLAB_FEATURES advertises dependency_scanning
# or secret_detection support.

brik-scan:
  artifacts:
    reports:
      sarif:
        - brik-artifacts/scan/deps.sarif
        - brik-artifacts/scan/secret.sarif

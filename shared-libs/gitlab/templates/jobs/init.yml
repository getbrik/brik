# Brik Init Stage
# Detects stack, validates brik.yml, sets up environment.

brik-init:
  stage: init
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage init'
  artifacts:
    when: always
    paths:
      - .brik-logs/pipeline.env
      - brik-artifacts/
    reports:
      dotenv: brik-init.env
    expire_in: 1 week
  after_script:
    # brik-init.env is now produced by stages.init itself (single source of
    # truth, see _stages.init._write_dotenv). after_script just echoes the
    # file content for build log inspection -- no more parallel yq calls.
    - |
      set +x
      if [ -f brik-init.env ]; then
        echo "[brik:init] dotenv (produced by stages.init):"
        cat brik-init.env
      else
        echo "[brik:init] WARN: brik-init.env missing"
      fi

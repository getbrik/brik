# Brik Init Stage
# Detects stack, validates brik.yml, sets up environment, and exports the
# BRIK_IMG_<CLASS> dotenv variables consumed by every downstream job's
# image: directive. Init is always-on (gate.mode=blocking + both contexts);
# the gate inherited from .brik-stage is a no-op for init.

brik-init:
  extends: .brik-stage
  stage: init
  image: ${BRIK_IMG_BASE}
  variables:
    BRIK_STAGE_ID: init
  needs:
    - { job: brik-plan, artifacts: true }
  after_script:
    # The env file is produced by the post-stage projection hook from the
    # report env section (see lib/pipeline/stage.sh _stage.run._project_env).
    # after_script just echoes the content for build log inspection.
    - |
      set +x
      if [ -f .brik-logs/pipeline.env ]; then
        echo "[brik:init] dotenv (projected from report env section):"
        cat .brik-logs/pipeline.env
      else
        echo "[brik:init] WARN: .brik-logs/pipeline.env missing"
      fi

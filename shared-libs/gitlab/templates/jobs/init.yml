# Brik Init Stage
# Detects stack, validates brik.yml, sets up environment.
#
# Init is not plan-gated: it is a blocking stage in every context and runs
# unconditionally. It still depends on brik-plan so it shares the same
# dependency edge as the rest of the flow.

brik-init:
  stage: init
  needs:
    - job: brik-plan
      artifacts: true
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage init'
  artifacts:
    when: always
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
    reports:
      dotenv: .brik-logs/pipeline.env
    expire_in: 1 week
  after_script:
    # The env file is produced by the post-stage projection hook from the
    # report env section (see lib/pipeline/stage.sh _stage.run._project_env).
    # after_script just echoes the content for build log inspection.
    - |
      set +x
      if [ -f .brik-logs/pipeline.env ]; then
        echo "[brik:init] dotenv (projected from report env section):"
        cat .brik-logs/pipeline.env
      else
        echo "[brik:init] WARN: .brik-logs/pipeline.env missing"
      fi

# Brik SAST Stage
# Static analysis: SAST (semgrep), license scanning, IaC (checkov).
# Runs in the analysis image (Python/Ruby runtime).

brik-sast:
  extends: .brik-stage
  stage: verify
  image: ${BRIK_IMG_ANALYSIS}
  variables:
    BRIK_STAGE_ID: sast
  needs:
    - { job: brik-plan,  artifacts: true }
    - { job: brik-init,  artifacts: true }
    - { job: brik-build, artifacts: true }
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull

# Brik Lint Stage
# Code quality checks: lint, format, type_check.
# Runs in the CI (stack) image alongside SAST, Scan, and Test (all in verify stage).

brik-lint:
  stage: verify
  needs:
    - job: brik-plan
      artifacts: true
    - job: brik-init
      artifacts: true
    - job: brik-build
      artifacts: true
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    # Synced from lib/stacks/_deps.sh::stacks.cache_paths.
    # Drift caught by spec/integration/cache_paths_parity_spec.sh.
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  script:
    - . /tmp/brik-plan-gate.sh lint
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage lint'
  artifacts:
    when: always
    expire_in: 1 week
    # reports.dotenv propagates pipeline.env keys as CI variables to
    # downstream jobs (cf. spec/integration/gitlab_dotenv_parity_spec.sh).
    reports:
      dotenv: .brik-logs/pipeline.env
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*

# Brik Release Stage
# Computes semantic version (conditional - only if release section configured).

brik-release:
  stage: release
  needs:
    - job: brik-init
      artifacts: true
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage release'
  artifacts:
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
    when: always
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_TAG'
      when: on_success
    - when: never

# Brik Release Stage
# Computes semantic version. The plan gates this stage to the release
# context (a tag push): on a snapshot pipeline `brik plan gate release`
# (inherited from .brik-stage) records a not-applicable fragment and
# the job exits 0.

brik-release:
  extends: .brik-stage
  stage: release
  image: ${BRIK_IMG_BASE}
  variables:
    BRIK_STAGE_ID: release
  needs:
    - { job: brik-plan, artifacts: true }
    - { job: brik-init, artifacts: true }

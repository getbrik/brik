# Brik Promote Stage (Phase 9.B)
# Re-tags the candidate Docker image to the release registry. The
# registry manifest gates this stage on gate.contexts=[release], so the
# planner marks it skip on snapshot pipelines; the inherited gate then
# records a not-applicable fragment and the job exits 0. The runtime
# self-skips when no candidate Docker config is present in brik.yml.

brik-promote:
  extends: .brik-stage
  stage: promote
  image: ${BRIK_IMG_DEPLOY}
  variables:
    BRIK_STAGE_ID: promote
  needs:
    - { job: brik-plan,           artifacts: true }
    - { job: brik-init,           artifacts: true }
    - { job: brik-package,        artifacts: true,  optional: true }
    - { job: brik-container-scan, artifacts: false, optional: true }

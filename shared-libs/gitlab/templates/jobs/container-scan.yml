# Brik Container Scan Stage
# Container image vulnerability scanning (grype/dockle).
# Runs after package (needs the built Docker image).

brik-container-scan:
  stage: post-verify
  image: "${BRIK_SCANNER_IMAGE}"
  needs:
    - job: brik-package
      artifacts: true
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage container-scan'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
  # The bash performs a silent skip (return 0, no fragment) when the
  # package stage did not produce a Docker image.

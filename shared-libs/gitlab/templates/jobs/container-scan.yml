# Brik Container Scan Stage
# Container image vulnerability scanning (grype/dockle).
# Runs after package (needs the built Docker image).
#
# The bash body silently skips (return 0, no fragment) when the package
# stage did not produce a Docker image.

brik-container-scan:
  extends: .brik-stage
  stage: post-verify
  image: ${BRIK_IMG_SCANNER}
  # This is the signing job (attestations are signed here), so it declares the
  # brik/signing environment with action: prepare (no deployment record):
  # operators scope the signing credential (e.g. the OpenBAO token) to that
  # environment and it reaches only this job, never the build/test jobs where
  # user-defined commands run -- the credential-isolation leg of the SLSA L2
  # posture.
  environment:
    name: brik/signing
    action: prepare
  variables:
    BRIK_STAGE_ID: container-scan
  needs:
    - { job: brik-plan,    artifacts: true }
    - { job: brik-init,    artifacts: true }
    - { job: brik-package, artifacts: true }

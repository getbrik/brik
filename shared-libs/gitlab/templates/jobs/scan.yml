# Brik Scan Stage
# Security scanning: dependency vulnerabilities (osv-scanner/grype),
# secrets (gitleaks/trufflehog). Runs in the scanner image (Go binaries).
#
# Artifacts override (extends doesn't merge): scan adds the CycloneDX SBOM
# report to the standard dotenv export. cyclonedx is free since GitLab
# 15.6 and surfaces as a Dependency List entry in the project.

brik-scan:
  extends: .brik-stage
  stage: verify
  image: ${BRIK_IMG_SCANNER}
  variables:
    BRIK_STAGE_ID: scan
  needs:
    - { job: brik-plan,  artifacts: true }
    - { job: brik-init,  artifacts: true }
    - { job: brik-build, artifacts: true }
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      dotenv: .brik-logs/pipeline.env
      cyclonedx:
        - brik-artifacts/scan/sbom.cdx.json
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*

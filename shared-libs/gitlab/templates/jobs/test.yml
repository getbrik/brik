# Brik Test Stage
# Runs tests via brik-lib. Runs in parallel with lint/sast/scan in verify stage.

brik-test:
  stage: verify
  # Generic regex that picks up the "[brik] coverage: XX.XX%" line emitted
  # by stages.test post-test (via lib/transverse/coverage.sh). One regex
  # works for all stacks because brik standardizes the summary line; the
  # underlying coverage file may be cobertura or jacoco.
  coverage: '/\[brik\] coverage: ([\d\.]+)%/'
  needs:
    - job: brik-init
      artifacts: true
    - job: brik-build
      artifacts: true
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage test'
  artifacts:
    when: always
    reports:
      junit: ${BRIK_TEST_JUNIT_PATH:-reports/junit.xml}
      # GitLab schema-validates coverage_format at YAML-parse time and
      # only accepts "cobertura" or "jacoco" -- variables resolved from
      # an upstream job's dotenv arrive too late. We hardcode the
      # cobertura defaults so python and dotnet projects get a coverage
      # badge out of the box. Java users (jacoco) and any project with
      # a non-default path can override at the project level; see
      # shared-libs/gitlab/README.md for the override recipe.
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage.xml
    paths:
      - ${BRIK_TEST_COVERAGE_DIR:-coverage}/
      - ${BRIK_TEST_JUNIT_PATH:-reports/junit.xml}
      - reports/
    expire_in: 1 week

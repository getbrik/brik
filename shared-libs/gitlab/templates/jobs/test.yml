# Brik Test Stage
# Runs tests via brik-lib. Runs in parallel with lint/sast/scan in verify stage.
#
# Artifacts override (extends doesn't merge): test adds junit + coverage
# reports to the standard dotenv export.

brik-test:
  extends: .brik-stage
  stage: verify
  image: ${BRIK_IMG_STACK}
  variables:
    BRIK_STAGE_ID: test
  # Generic regex that picks up the "[brik] coverage: XX.XX%" line emitted
  # by stages.test post-test (via lib/transverse/coverage.sh). One regex
  # works for all stacks because brik standardizes the summary line; the
  # underlying coverage file may be cobertura or jacoco.
  coverage: '/\[brik\] coverage: ([\d\.]+)%/'
  needs:
    - { job: brik-plan,  artifacts: true }
    - { job: brik-init,  artifacts: true }
    - { job: brik-build, artifacts: true }
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      dotenv: .brik-logs/pipeline.env
      junit: ${BRIK_TEST_JUNIT_PATH:-brik-artifacts/test/junit.xml}
      coverage_report:
        coverage_format: cobertura
        path: brik-artifacts/test/coverage/coverage.xml
    paths:
      - .brik-logs/
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*

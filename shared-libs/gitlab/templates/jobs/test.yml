# Brik Test Stage
# Runs tests via brik-lib. Runs in parallel with lint/sast/scan in verify stage.

brik-test:
  stage: verify
  needs:
    - job: brik-init
      artifacts: true
    - job: brik-build
      artifacts: true
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull
  script:
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage test'
  artifacts:
    when: always
    reports:
      junit: ${BRIK_TEST_JUNIT_PATH:-reports/junit.xml}
      coverage_report:
        coverage_format: ${BRIK_TEST_COVERAGE_FORMAT_GITLAB:-cobertura}
        path: ${BRIK_TEST_COVERAGE_PATH:-coverage/coverage.xml}
    paths:
      - ${BRIK_TEST_COVERAGE_DIR:-coverage}/
      - ${BRIK_TEST_JUNIT_PATH:-reports/junit.xml}
      - reports/
    expire_in: 1 week

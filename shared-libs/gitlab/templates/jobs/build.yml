# Brik Build Stage
# Compiles/builds the project via brik-lib.
#
# Cache strategy: dependency download caches are saved here (pull-push).
# Downstream stages (test, quality, security) use pull-only policy.
# All cache paths are listed -- only those populated by the active stack are cached.
# Node uses --cache .npm (no env var needed); other stacks use env vars from pipeline.yml.

brik-build:
  stage: build
  needs:
    - job: brik-plan
      artifacts: true
    - job: brik-init
      artifacts: true
    - job: brik-release
      artifacts: true
      optional: true
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    # Synced from lib/stacks/_deps.sh::stacks.cache_paths.
    # Drift caught by spec/integration/cache_paths_parity_spec.sh.
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull-push
    when: always
  script:
    - . /tmp/brik-plan-gate.sh build
    - bash -c '. /tmp/brik-bootstrap.sh && brik.gitlab.run_stage build'
  artifacts:
    when: always
    # reports.dotenv propagates pipeline.env keys as CI variables to
    # downstream jobs (cf. spec/integration/gitlab_dotenv_parity_spec.sh).
    reports:
      dotenv: .brik-logs/pipeline.env
    paths:
      - .brik-logs/
      - dist/
      - build/
      - target/
      - bin/
      - "*.whl"
      - "*.tar.gz"
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
      - node_modules/
      - .venv/
      - __pycache__/
    expire_in: 1 week

# Brik Build Stage
# Compiles/builds the project via brik-lib.
#
# Cache strategy: dependency download caches are saved here (pull-push).
# Downstream stages (test, lint, security) use pull-only policy.
# Artifacts override (extends doesn't merge): build adds dist/build/target/
# alongside the standard .brik-logs/+brik-artifacts/ from .brik-stage.

brik-build:
  extends: .brik-stage
  stage: build
  image: ${BRIK_IMG_STACK}
  variables:
    BRIK_STAGE_ID: build
  needs:
    - { job: brik-plan,    artifacts: true }
    - { job: brik-init,    artifacts: true }
    - { job: brik-release, artifacts: true, optional: true }
  cache:
    key: "${BRIK_BUILD_STACK}-${CI_COMMIT_REF_SLUG}"
    # Synced from lib/stacks/_deps.sh::stacks.cache_paths.
    # Drift caught by spec/integration/cache_paths_parity_spec.sh.
    paths:
      - .npm/
      - .cache/pip
      - .m2/repository
      - .gradle/caches
      - .gradle/wrapper
      - .cargo/registry
      - .cargo/git
      - .nuget/packages
    fallback_keys:
      - "${BRIK_BUILD_STACK}-${CI_DEFAULT_BRANCH}"
      - "${BRIK_BUILD_STACK}-default"
    policy: pull-push
    when: always
  # Artifacts override .brik-stage's defaults so build outputs ship to
  # downstream consumers (package, deploy). We re-declare the standard
  # paths/exclude/dotenv plus the build-specific paths and exclusions.
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      dotenv: .brik-logs/pipeline.env
    paths:
      - .brik-logs/
      - dist/
      - build/
      - target/
      - bin/
      - "*.whl"
      - "*.tar.gz"
      - brik-artifacts/
    exclude:
      - .brik-logs/*.lock
      - .brik-logs/context-*
      - node_modules/
      - .venv/
      - __pycache__/

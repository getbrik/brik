# Brik Deploy Stage
# Deploys to target environments configured in brik.yml. The plan gates
# this stage on the --with-deploy opt-in (resolved by brik-plan from
# BRIK_WITH_DEPLOY). The runtime evaluates deploy.environments[].when
# conditions and skips environments that don't match the current Git
# context. If no deploy.environments is configured, the runtime skips
# gracefully.

brik-deploy:
  extends: .brik-stage
  stage: deploy
  image: ${BRIK_IMG_DEPLOY}
  variables:
    BRIK_STAGE_ID: deploy
  needs:
    - { job: brik-plan,           artifacts: true }
    - { job: brik-init,           artifacts: true }
    - { job: brik-release,        artifacts: true,  optional: true }
    - { job: brik-test }
    - { job: brik-package,        artifacts: true,  optional: true }
    - { job: brik-lint,           artifacts: false, optional: true }
    - { job: brik-sast,           artifacts: false, optional: true }
    - { job: brik-scan,           artifacts: false, optional: true }
    - { job: brik-container-scan, artifacts: false, optional: true }

# Brik GitLab CI Pipeline Template (LEGACY)
#
# DEPRECATED: this single-pipeline template is superseded by the parent
# + child pair declared in `dynamic-pipeline.yml`, which adds
# impact-driven stage selection (docs-only commits skip the lint/test
# grid without runner containers). New projects should include
# `/templates/dynamic-pipeline.yml` instead.
#
# This file stays in the catalog for two minor versions (v0.6.x and
# v0.7.x) so existing pipelines keep working, and remains load-bearing
# because the dynamic template's child pipeline re-uses it verbatim.
# It is removed as a public entry point in v0.8.0.
# See `docs/platforms/gitlab-dynamic-pipeline.md` for the one-line
# migration diff (swap the include path, brik.yml is unchanged).
#
# It implements the fixed flow: Init -> Release -> Build -> Lint||SAST||Scan||Test -> Package -> Container Scan -> Deploy -> Notify
#
# Usage in your .gitlab-ci.yml:
#   include:
#     - project: 'brik/gitlab-templates'
#       ref: v1
#       file: '/templates/pipeline.yml'

# ---------------------------------------------------------------------------
# Workflow rules (upstream pipeline filter, C1 of chantier #15)
#
# GitLab evaluates `workflow:` before any job runs and decides whether a
# pipeline exists at all. Without these rules every push generates a
# pipeline -- including a duplicate when a push lands on a branch with
# an open MR, and pipelines on sources that no human asked for
# (parent_pipeline, trigger, webide).
#
# The five permitted sources cover every legitimate Brik trigger:
#   1. MR pipelines       -- the canonical CI for branch work
#   2. Tag pipelines      -- release context (cf. docs/concepts/pipeline-context.md)
#   3. Default-branch     -- the standard "merged to main" flow
#   4. Scheduled          -- nightly E2E, cron-driven release rebuilds
#   5. Web (UI / API)     -- on-demand re-runs by an operator
#
# Any other source (push to a feature branch with an open MR; push without
# MR; trigger; webide; ...) is intentionally suppressed.
# ---------------------------------------------------------------------------
workflow:
  rules:
    # Anti-duplicate push+MR: if the branch has an open MR, skip the
    # branch pipeline and let the MR pipeline cover the change.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
variables:
  BRIK_LIB_REF: "v0.5.0"
  BRIK_REPO: "${CI_SERVER_URL}/brik/brik.git"
  BRIK_HOME: "/opt/brik"
  BRIK_LOG_LEVEL: "info"
  BRIK_PLATFORM: "gitlab"
  BRIK_CI_IMAGE: "ghcr.io/getbrik/brik-runner-base:latest"
  BRIK_ANALYSIS_IMAGE: "ghcr.io/getbrik/brik-runner-analysis:latest"
  BRIK_SCANNER_IMAGE: "ghcr.io/getbrik/brik-runner-scanner:latest"
  BRIK_DEPLOY_IMAGE: "ghcr.io/getbrik/brik-runner-deploy:latest"
  # User-overridable pipeline inputs. The long form (value/description/options)
  # surfaces these in the "Run pipeline" UI form -- short-form variables are
  # used at runtime but stay invisible. `options` requires GitLab >= 15.7;
  # older versions ignore it and fall back to a free-form text field but
  # still honour the description.
  BRIK_DRY_RUN:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Skip destructive deploy actions (compose up, k8s apply, helm upgrade, argocd sync, rsync). Print what would run instead. Mirrors the Jenkins BRIK_DRY_RUN booleanParam."
  BRIK_TAG:
    value: ""
    description: "Release tag for this build (e.g. v0.1.0). Leave empty for snapshot builds. Mirrors GitLab CI_COMMIT_TAG semantics."
  # Cache relocation: redirect tool caches into $CI_PROJECT_DIR (GitLab constraint)
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

# ---------------------------------------------------------------------------
# Stages - Fixed Flow
# ---------------------------------------------------------------------------
stages:
  - init
  - release
  - build
  - verify
  - package
  - post-verify
  - deploy
  - notify

# ---------------------------------------------------------------------------
# Default job configuration
# ---------------------------------------------------------------------------
default:
  image: ${BRIK_CI_IMAGE}
  before_script:
    # Bootstrap prerequisites (yq, jq, git, bash) - skip if brik-runner image
    - |
      if [ -f "/.brik-runner" ]; then
        echo "[brik] brik-runner image detected, skipping prerequisite install"
      elif [ -f "${BRIK_HOME}/scripts/bootstrap-prereqs.sh" ]; then
        . "${BRIK_HOME}/scripts/bootstrap-prereqs.sh"
        bootstrap_prereqs
      else
        _bootstrap_detect_pkg_manager() {
          for _m in apk apt-get yum dnf; do
            command -v "$_m" >/dev/null 2>&1 && echo "$_m" && return 0
          done
          echo ""
        }
        _mgr="$(_bootstrap_detect_pkg_manager)"
        if ! command -v yq >/dev/null 2>&1; then
          echo "[brik] Installing yq..."
          _yq_v="${BRIK_YQ_VERSION:-v4.44.1}" _arch="$(uname -m)" _os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          case "$_arch" in x86_64) _arch="amd64" ;; aarch64) _arch="arm64" ;; esac
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${_yq_v}/yq_${_os}_${_arch}" 2>/dev/null && chmod +x /usr/local/bin/yq || {
            echo "[brik] wget failed, falling back to apk..."
            case "$_mgr" in
              apk) apk add --no-cache yq ;;
            esac
          }
        fi
        for _t in jq git bash; do
          if ! command -v "$_t" >/dev/null 2>&1; then
            echo "[brik] Installing ${_t}..."
            case "$_mgr" in
              apk)     apk add --no-cache "$_t" ;;
              apt-get) apt-get update -qq 2>/dev/null; apt-get install -y -qq "$_t" ;;
              yum)     yum install -y "$_t" ;;
              dnf)     dnf install -y "$_t" ;;
            esac
          fi
        done
      fi
    # Clone the Brik runtime if not already present
    - |
      if [ ! -d "${BRIK_HOME}" ]; then
        echo "[brik] Cloning Brik runtime (${BRIK_LIB_REF})..."
        git clone --depth 1 --branch "${BRIK_LIB_REF}" "${BRIK_REPO}" "${BRIK_HOME}" 2>/dev/null \
          || git clone --depth 1 "${BRIK_REPO}" "${BRIK_HOME}"
      fi
    # Protect .brik-logs from accidental git add
    - |
      if [ -d "${CI_PROJECT_DIR}/.git/info" ]; then
        echo '.brik-logs/' >> "${CI_PROJECT_DIR}/.git/info/exclude"
      fi
    # Prepare Brik bootstrap script (sourced by each job via bash)
    # Stack tools (node, python, java, etc.) are installed by bootstrap.prepare_env
    # called inside brik.gitlab.setup
    - |
      cat > /tmp/brik-bootstrap.sh << 'BRIK_EOF'
      . "${BRIK_HOME}/shared-libs/gitlab/scripts/gitlab-wrapper.sh"
      brik.gitlab.setup "${BRIK_HOME}"
      BRIK_EOF
      chmod +x /tmp/brik-bootstrap.sh

# ---------------------------------------------------------------------------
# Include job templates
# ---------------------------------------------------------------------------
include:
  - local: '/templates/jobs/init.yml'
  - local: '/templates/jobs/release.yml'
  - local: '/templates/jobs/build.yml'
  - local: '/templates/jobs/lint.yml'
  - local: '/templates/jobs/sast.yml'
  - local: '/templates/jobs/sast-reports.yml'
    rules:
      - if: '$CI_GITLAB_FEATURES =~ /\bsast\b/'
  - local: '/templates/jobs/scan.yml'
  - local: '/templates/jobs/scan-reports.yml'
    rules:
      - if: '$CI_GITLAB_FEATURES =~ /\b(dependency_scanning|secret_detection)\b/'
  - local: '/templates/jobs/test.yml'
  - local: '/templates/jobs/package.yml'
  - local: '/templates/jobs/container-scan.yml'
  - local: '/templates/jobs/deploy.yml'
  - local: '/templates/jobs/notify.yml'

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          shellcheck --severity=warning bin/brik
          shellcheck --severity=warning -x lib/pipeline/*.sh
          shellcheck --severity=warning -x lib/transverse/*.sh lib/transverse/**/*.sh
          shellcheck --severity=warning -x lib/stages/*.sh lib/stages/**/*.sh
          shellcheck --severity=warning -x lib/stacks/*.sh
          shellcheck --severity=warning -x lib/deployments/*.sh
          shellcheck --severity=warning -x lib/package-managers/*.sh
          shellcheck --severity=warning -x lib/cli/*.sh
          shellcheck --severity=warning -x shared-libs/jenkins/scripts/*.sh
          shellcheck --severity=warning -x shared-libs/gitlab/scripts/*.sh

      - name: Install jv (JSON Schema validator)
        run: |
          go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Validate JSON Schemas (V.3)
        run: scripts/validate-schemas.sh

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Registry schema-enum sync
        # Fails if the project.stack enum in schemas/config/v1/brik.schema.json
        # drifts from the language stacks declared in the manifests.
        run: scripts/compile-registry.sh --check-schema-enum

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq binutils-dev libcurl4-openssl-dev zlib1g-dev libdw-dev libiberty-dev cmake g++
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          # Install check-jsonschema
          pip install check-jsonschema
          # Install kcov from source (not available via apt on Ubuntu 24.04)
          KCOV_VERSION=43
          wget -q https://github.com/SimonKagstrom/kcov/archive/refs/tags/v${KCOV_VERSION}.tar.gz -O kcov-${KCOV_VERSION}.tar.gz
          tar xzf kcov-${KCOV_VERSION}.tar.gz
          cd kcov-${KCOV_VERSION}
          mkdir build && cd build
          cmake ..
          make -j$(nproc)
          sudo make install

      - name: Install jv (JSON Schema validator)
        run: |
          # jv is the schema validator brik prefers (check-jsonschema is the
          # fallback). Without it on PATH, every `Skip if jv_missing` spec
          # block is skipped and the jv-gated lib code (org_policy.load,
          # schema-emit paths, ...) drops out of the coverage report.
          # cmd/jv is a separate Go module; v0.7.0 is the latest published
          # cmd/jv tag and pulls in jsonschema/v6 transitively.
          go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install ShellSpec
        run: |
          curl -fsSL https://git.io/shellspec | sh -s -- --yes

      - name: Run tests with coverage
        run: |
          export PATH="$HOME/.local/lib/shellspec:$PATH"
          ulimit -n 1024
          shellspec --kcov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  bench-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Compile registry cache
        run: scripts/compile-registry.sh

      - name: Bench brik plan (V.4)
        # Regression gate for `brik plan`, calibrated to the measured cost
        # on a GitHub-hosted runner (~3.1s p99 on the 5000-file fixture).
        # The threshold leaves headroom for runner variance and flags a
        # real slowdown; speeding the planner up (the registry cold-load
        # dominates each invocation) is tracked as a separate optimisation.
        run: |
          scripts/bench-plan.sh \
            --runs 12 \
            --files 5000 \
            --max-p50-ms 4000 \
            --max-p99-ms 5000 \
            --out /tmp/bench-plan.json

      - name: Upload bench artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-plan-results
          path: /tmp/bench-plan.json
          if-no-files-found: ignore

  metrics:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install shellmetrics
        run: |
          git clone --depth 1 https://github.com/shellspec/shellmetrics.git /tmp/shellmetrics
          sudo cp /tmp/shellmetrics/shellmetrics /usr/local/bin/shellmetrics
          sudo chmod +x /usr/local/bin/shellmetrics

      - name: Generate metrics badges
        run: |
          # Run shellmetrics and extract the summary totals line
          # Format: NLOC_total NLOC_avg LLOC_total LLOC_avg CCN_avg Func_cnt File_cnt ...
          summary=$(find lib shared-libs -name '*.sh' -not -path '*/spec/*' | \
            xargs shellmetrics --no-color 2>/dev/null | tail -2 | head -1)

          # Parse whitespace-separated fields (locale may use comma as decimal separator)
          lloc=$(echo "$summary" | awk '{print $3}')
          ccn_avg=$(echo "$summary" | awk '{print $5}' | tr ',' '.')
          func_cnt=$(echo "$summary" | awk '{print $6}')

          echo "LLOC=$lloc CCN_avg=$ccn_avg Functions=$func_cnt"

          # Determine CCN color
          ccn_int=${ccn_avg%%.*}
          if [ "$ccn_int" -lt 5 ]; then
            ccn_color="brightgreen"
          elif [ "$ccn_int" -lt 10 ]; then
            ccn_color="yellow"
          else
            ccn_color="red"
          fi

          # Write badge JSON files
          mkdir -p docs/badges
          jq -n --arg msg "$ccn_avg" --arg color "$ccn_color" \
            '{schemaVersion:1, label:"avg CCN", message:$msg, color:$color}' \
            > docs/badges/ccn.json
          jq -n --arg msg "$func_cnt" \
            '{schemaVersion:1, label:"functions", message:$msg, color:"informational"}' \
            > docs/badges/functions.json
          jq -n --arg msg "$lloc" \
            '{schemaVersion:1, label:"LLOC", message:$msg, color:"informational"}' \
            > docs/badges/lloc.json

          # Validate JSON
          for f in docs/badges/*.json; do
            jq empty "$f"
            echo "  $f: $(cat "$f")"
          done

      - name: Commit badge updates (signed via GraphQL)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- docs/badges/; then
            echo "No badge changes to commit"
            exit 0
          fi
          HEAD_OID=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)
          additions=$(find docs/badges -type f -name '*.json' | sort | while read -r f; do
            jq -n --arg path "$f" --arg contents "$(base64 -w0 < "$f")" \
              '{path: $path, contents: $contents}'
          done | jq -s .)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg oid "$HEAD_OID" \
            --argjson additions "$additions" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { url oid } } }",
              variables: {
                input: {
                  branch: { repositoryNameWithOwner: $repo, branchName: "main" },
                  message: { headline: "ci: update shellmetrics badges" },
                  expectedHeadOid: $oid,
                  fileChanges: { additions: $additions }
                }
              }
            }' | gh api -X POST graphql --input -

name: Docs drift

on:
  push:
    branches: [main]
    paths:
      - 'schemas/config/**'
      - 'docs/configuration/**'
      - 'scripts/gen-config-reference.sh'
      - 'scripts/validate-docs.sh'
      - '.github/workflows/docs-drift.yml'
  pull_request:
    branches: [main]
    paths:
      - 'schemas/config/**'
      - 'docs/configuration/**'
      - 'scripts/gen-config-reference.sh'
      - 'scripts/validate-docs.sh'
      - '.github/workflows/docs-drift.yml'

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install jq + yq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          YQ_VERSION="v4.45.1"
          sudo wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Install jv (JSON Schema validator)
        run: |
          # cmd/jv is a separate Go module from the parent jsonschema library.
          # Its tags follow `cmd/jv/v0.x.y`, independent of the library's
          # `v6.x.y`. v0.7.0 is the latest published cmd/jv tag and pulls in
          # jsonschema/v6 v6.0.1 transitively.
          go install github.com/santhosh-tekuri/jsonschema/cmd/jv@v0.7.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Validate inline YAML blocks in docs/configuration
        run: make validate-docs

      - name: Verify schema-doc tables are in sync
        run: make check-docs-drift
